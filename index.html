<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202020">
<meta name="color-scheme" content="dark">
<title>Shared Intelligence</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shared Intelligence">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="" width="28" height="28">
    <div><b>Shared Intelligence</b><span>Your agents, work and notes</span></div>
  </div>
  <div class="top-right">
    <button type="button" id="queue" class="pill warn linkish" data-a="queue" data-id="x" hidden></button>
    <span id="fresh" class="pill warn" role="status">Loading…</span>
    <button type="button" class="btn" id="refresh" data-a="refresh" data-id="x">Refresh</button>
    <button type="button" class="btn primary" id="new" data-a="new" data-id="x" aria-expanded="false" hidden>New</button>
  </div>
</header>
<div id="banner" class="banner warn" role="status" hidden></div>
<div class="shell">
  <nav id="nav" aria-label="Views"></nav>
  <main>
    <h1 id="view-title" tabindex="-1">Overview</h1>
    <div id="main"><div class="empty"><b>Loading…</b></div></div>
  </main>
</div>
<nav id="mobile-tabs" aria-label="Phone navigation"></nav>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">This dashboard needs JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
